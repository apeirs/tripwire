<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripwire Monitor</title>
<link rel="icon" href="data:,">
<meta name="description" content="Live view of a Tripwire drain guard: watched move on the origin chain, the Reactive Network trip, and the Guardian sweeps on every chain.">
<style>
  :root {
    --bg: #0c1016; --panel: #141a22; --panel2: #1a222c; --border: #273140; --text: #e6edf3; --muted: #8a97a6;
    --ok: #3fb96f; --bad: #ff5d5d; --warn: #e3a92b; --info: #5ea8ff; --trip-bg: #2a1518;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #fff; --panel2: #f0f2f5; --border: #d9dee5; --text: #18202a; --muted: #5d6a78;
    --ok: #1a7f45; --bad: #c62828; --warn: #9a6700; --info: #0b62d6; --trip-bg: #fdeceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--info); text-decoration: none; font-family: var(--mono); font-size: 13px; }
  a:hover { text-decoration: underline; }
  .mono { font-family: var(--mono); font-size: 13px; }
  #header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .brand .logo { color: var(--bad); }
  .brand .sub { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px 24px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  html, body { overflow-x: clip; } /* clip, not hidden: hidden makes body a scroll container and breaks the sticky header */
  .banner { max-width: 1240px; margin: 12px auto 0; padding: 10px 24px; color: var(--warn); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; min-width: 0; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .notice { color: var(--muted); }
  .muted { color: var(--muted); } .small { font-size: 12px; font-weight: 400; }
  .ok-t { color: var(--ok); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .3px; }
  .pill-live { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .pill-mock { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill-trip { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
  .pill-ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .pill-wait { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .chip { display: inline-block; padding: 0 7px; border-radius: 5px; font-size: 12px; font-weight: 600; white-space: nowrap;
    color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 6px 0 4px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 18px; margin-bottom: 10px; }
  .kv .k { color: var(--muted); font-size: 12px; display: block; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .tbl td { padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); vertical-align: middle; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar-cell { min-width: 150px; }
  .bar { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--bad) 35%, transparent); vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .bar-v { height: 100%; background: var(--ok); transition: width .6s ease; }
  .trip { border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--border)); background: var(--trip-bg); border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
  .trip.trip-swept { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); background: var(--panel2); }
  .trip header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .trip footer { margin-top: 10px; font-size: 14px; }
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1.6fr; gap: 10px; align-items: stretch; }
  .arrow { align-self: center; color: var(--muted); font-size: 20px; }
  .step { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; min-width: 0; }
  .step-h { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .step-b { margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .lat { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--warn); margin: 0 4px; }
  .sweep { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .sweep:last-child { border-bottom: 0; }
  .sweep.done .lat { color: var(--ok); }
  .sweep .meta { margin-left: auto; }
  .sweep .what { flex: 1 1 100%; }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 5px 4px; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); font-size: 14px; }
  .row .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .row .txt { flex: 1 1 260px; }
  .row .meta { margin-left: auto; }
  .row-alarm .txt { color: var(--bad); font-weight: 600; }
  .row-trip .txt { color: var(--warn); font-weight: 600; }
  .row-sweep .txt { color: var(--ok); }
  .verdict { font-size: 12px; padding: 1px 7px; border-radius: 5px; }
  .v-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .v-trip { color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, transparent); font-weight: 700; }
  .toggle { margin-left: auto; cursor: pointer; }
  .raw { font-family: var(--mono); font-size: 11.5px; background: var(--panel2); padding: 10px; border-radius: 6px; overflow-x: auto; max-height: 360px; }
  @media (max-width: 860px) {
    #header, main { padding-left: 16px; padding-right: 16px; }
    .flow { grid-template-columns: 1fr; }
    .arrow { transform: rotate(90deg); justify-self: center; }
    .tbl { display: block; overflow-x: auto; }
    .banner { padding: 10px 16px; }
    .meta { white-space: normal; word-break: break-all; }
    .sweep .meta, .row .meta { margin-left: 0; }
    .brand .sub { display: block; margin-left: 0; }
    .tbl th, .tbl td { padding: 4px 6px; }
    .bar-cell { min-width: 0; white-space: nowrap; }
    .bar { width: 48px; margin-right: 6px; }
  }
</style>
</head>
<body>
<div id="header"></div>
<div id="banner"></div>
<main id="main"><section class="panel notice">Loading…</section></main>
<noscript>This page needs JavaScript: it reads the chains directly from public RPCs.</noscript>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
